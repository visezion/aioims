name: AIMS CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AIMS_BOOTSTRAP_ADMIN_PASSWORD: ChangeMe123!
      DATABASE_URL: sqlite:///./tmp/ci-aims.db
      AIMS_SEED_DEMO_DATA: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: python -m pip install -r python_backend/requirements.txt
      - run: mkdir -p tmp
      - run: npm run test:backend
      - run: npm run test:api
